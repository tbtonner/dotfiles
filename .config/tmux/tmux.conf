if-shell 'test -f /etc/arch-release' \
    'set -g default-shell /usr/bin/fish; set -s copy-command wl-copy' \
    'set -g default-shell /opt/homebrew/bin/fish; set -s copy-command pbcopy'

set -g mouse on
setw -g mode-keys vi
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -g focus-events on
set -g history-limit 20000

# fzf theme for popup pickers (popups use the server environment, not the calling shell's)
set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.config/fzf/kanagawa"
set -g set-clipboard on
set -g renumber-windows on
set -g detach-on-destroy no-detached

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key e copy-mode

set-option -g status on
set-option -g status-keys vi
set-option -g status-justify absolute-centre
set-option -g status-left-length 40
set-option -g status-left "#[fg=#957FB8]#S#[default]"
set-option -g status-right "#[fg=#DCD7BA]%H:%M #[fg=#7E9CD8,bg=default]%Y/%m/%d"
set-window-option -g window-status-format "#[fg=#DCD7BA]#W"
set-window-option -g window-status-current-format "#[fg=#E6C384]#W"

set -g status-style bg=default
set-option -g status-position top

set -g pane-active-border-style bg=default,fg=#e4c284

# tmux 3.8 defaults popups to bg=themedarkgrey; use the terminal (kanagawa) background instead
set -g popup-style bg=default,fg=default
set -g popup-border-style bg=default,fg=#DCD7BA

# Smart pane switching with awareness of Vim splits. At the edge of the window, C-h/C-l fall through to the
# previous/next window and C-k/C-j to the previous/next session (see navigate.sh).
navigate='~/.config/tmux/navigate.sh'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' "run-shell '$navigate L #{pane_id}'"
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' "run-shell '$navigate D #{pane_id}'"
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' "run-shell '$navigate U #{pane_id}'"
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' "run-shell '$navigate R #{pane_id}'"
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

# navigation of splits
bind-key -T copy-mode-vi 'C-h' run-shell "$navigate L #{pane_id}"
bind-key -T copy-mode-vi 'C-j' run-shell "$navigate D #{pane_id}"
bind-key -T copy-mode-vi 'C-k' run-shell "$navigate U #{pane_id}"
bind-key -T copy-mode-vi 'C-l' run-shell "$navigate R #{pane_id}"
bind-key -T copy-mode-vi 'C-\' select-pane -l

# vim copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Copy mode pipe into nvim
bind-key a run-shell '~/.config/tmux/capture-to-nvim.sh popup'
bind-key A run-shell '~/.config/tmux/capture-to-nvim.sh window'

# Split panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Kill
bind-key d kill-pane
bind-key x kill-window

# Window
bind c new-window -c "#{pane_current_path}"
bind-key l next-window
bind-key h previous-window

# Sessions
bind-key [ switch-client -p
bind-key ] switch-client -n
bind-key S new-session -c "#{pane_current_path}"
bind-key . command-prompt -I "#S" "rename-session '%%'"

# fzf popups
bind-key f display-popup -E -w 90% -h 90% '~/.config/tmux/session-picker.sh'
bind-key w display-popup -E -w 90% -h 90% '~/.config/tmux/window-picker.sh'
bind-key K kill-session
bind-key H display-popup -E -b rounded -S fg=#DCD7BA -w 90% -h 90% "nvim -R -c 'setlocal nomodifiable' ~/.config/tmux/help.md"

# Claude Code's native installer names its binary after the version (e.g. 2.1.301), so show it as "claude"
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'
